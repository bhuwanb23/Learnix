<body class="bg-surface text-on-surface min-h-screen pb-32">

<h1 class="font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight text-[#0050d4] dark:text-[#7b9cff]">Unit 4: Advanced Calculus</h1>
</div>
<button class="text-[#0050d4] font-bold font-['Plus_Jakarta_Sans'] hover:bg-[#eef1f3] px-4 py-2 rounded-xl transition-colors active:scale-95 duration-200">

</div>

<div class="flex-1 bg-surface-container-high rounded-full"></div>

<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="flag">flag</span>
</button>
</div>

</div>
</div>
</button>
<button class="w-full text-left p-6 rounded-xl bg-surface-container-lowest border-2 border-primary shadow-sm group active:scale-[0.98]">

<span class="w-8 h-8 flex items-center justify-center rounded-full bg-primary text-white font-bold text-sm">B</span>
<span class="text-lg font-bold text-on-surface leading-relaxed">e² - 1</span>
</div>
<span class="material-symbols-outlined text-primary" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>

</div>

</button>
</div>
