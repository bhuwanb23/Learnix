version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnix
      POSTGRES_PASSWORD: learnix_secret
      POSTGRES_DB: learnix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnix"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend API ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://learnix:learnix_secret@postgres:5432/learnix
      PORT: 4000
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: "http://localhost:80,http://localhost:3000"
      TRUST_PROXY: "true"
      DATABASE_SEED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  # ── Web (Expo web on nginx) ─────────────────────────────
  web:
    build:
      context: ./learnix
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
