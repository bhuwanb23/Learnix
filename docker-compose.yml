services:
  # ── Backend API (SQLite stored in a named volume) ────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # SQLite file lives on the mounted volume
      DATABASE_URL: file:/app/data/learnix.db
      PORT: 4000
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 30d
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: "http://localhost,http://localhost:8081,http://localhost:19006"
      TRUST_PROXY: "true"
      # Set DATABASE_SEED=true on first boot to load demo data
      DATABASE_SEED: ${DATABASE_SEED:-false}
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  # ── Web (Expo web export on nginx, /api/ proxied) ────────
  web:
    build:
      context: ./learnix
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
