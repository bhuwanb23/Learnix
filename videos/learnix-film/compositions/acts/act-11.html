<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Learnix Master Film — FINAL</title>
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/film.css" />
<style>
  /* Sub-composition roots are styled by id: rules get scoped to
     [data-composition-id], so a root class would become a descendant selector
     that cannot match the root itself. */
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; container-type: size; }
  #root .clip { opacity: 1; }
</style>
</head>
<body>
<div id="root" data-composition-id="act-11" data-start="0" data-duration="15.000" data-width="1920" data-height="1080">
    <div id="s59" class="clip scene-clip" data-start="0" data-duration="7" data-track-index="0" data-split="close">
      <div class="ground ground-clean"></div>
      <div class="card-close">
    <div class="card-line" data-part="line1">Run the institution.</div>
    <div class="card-line" data-part="line2">Not the paperwork.</div>
  </div>
    </div>
    <div id="s60" class="clip scene-clip" data-start="7" data-duration="5" data-track-index="0" data-split="logo">
      <div class="ground ground-clean"></div>
      <div class="card-close">
    <div class="logo-mark">
      <div class="logo-tile" data-part="tile0" style="left:12px;top:12px;background:var(--primary)"></div><div class="logo-tile" data-part="tile1" style="left:88px;top:12px;background:var(--accent)"></div><div class="logo-tile" data-part="tile2" style="left:12px;top:88px;background:var(--primary-dark)"></div><div class="logo-tile" data-part="tile3" style="left:88px;top:88px;background:var(--info)"></div>
      <div class="logo-word" data-part="word" style="position:absolute;left:0;top:76px;width:220px;text-align:center;font-size:40px;opacity:0">L</div>
    </div>
    <div class="logo-word" data-part="mark">Learnix</div>
    <div class="logo-sub" data-part="sub">The digital operating system for modern colleges.</div>
  </div>
    </div>
    <div id="s61" class="clip scene-clip" data-start="12" data-duration="3" data-track-index="0">
      <div class="ground ground-clean"></div>
      
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  tl.fromTo("#s59 [data-part='line2']", {opacity: 0}, {opacity: 1, duration: 0.7}, 0.8);
  tl.fromTo("#s60 .logo-tile", {opacity: 0, scale: 0.6}, {opacity: 1, scale: 1, duration: 0.4, stagger: 0.12, ease: "back.out(2)"}, 7);
  tl.fromTo("#s60 [data-part='mark']", {opacity: 0, y: 14}, {opacity: 1, y: 0, duration: 0.6}, 7.6);
  tl.fromTo("#s60 [data-part='sub']", {opacity: 0}, {opacity: 1, duration: 0.6}, 8.1);
  tl.fromTo("#s61 .ui-card, #s61 .dia-wrap, #s61 .quote-stage, #s61 .card-close, #s61 .chaos-grid, #s61 .abs-field", {opacity: 0}, {opacity: 1, duration: 0.6, ease: "power2.out"}, 12);
  tl.to("#s61 .abs-glow", {scale: 1.14, opacity: 0.62, transformOrigin: "50% 50%", duration: 2.00, ease: "sine.inOut"}, 12);
  window.__timelines["act-11"] = tl;
</script>
</body>
</html>
