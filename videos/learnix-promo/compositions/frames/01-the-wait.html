<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  const world = document.getElementById("f01-world");
  const pagewrap = document.getElementById("f01-pagewrap");
  const title = "#f01-title";
  const eyebrow = "#f01-eyebrow";
  const body = "#f01-body";
  const lock = "#f01-lock";
  const pills = ["#f01-pill-pending", "#f01-pill-locked"];
  const dotCore = document.getElementById("f01-dot-core");
  const dotRing = document.getElementById("f01-dot-ring");

  // --- Camera -------------------------------------------------------------
  // One .world wrapper carries the whole camera. Single source of truth (cam.t),
  // single writer (applyCamera). The counter-translate is T = -offset * S,
  // expressed generally: the focus point eases from the status-card centre to
  // the world centre, so the detail drifts out of frame-centre into its home
  // slot as the wide takes over.
  const CENTER_X = 960;
  const CENTER_Y = 540;
  const START_SCALE = 3.6;      // 564px status card -> 2029px, edge to edge
  const FOCUS_X = 370;          // measured status-card centre, neutral camera
  const FOCUS_Y = 376.5;

  const cam = { t: 0 };
  function applyCamera() {
    const s = START_SCALE + (1 - START_SCALE) * cam.t;
    const m = Math.pow(cam.t, 2.2);
    const fx = FOCUS_X + (CENTER_X - FOCUS_X) * m;
    const fy = FOCUS_Y + (CENTER_Y - FOCUS_Y) * m;
    // Counter-translate is T = -offset x S, i.e. s * (CENTER - focus): with
    // transform-origin at the world centre, screen = O + T + s*(p - O), so
    // mapping the focus point onto the canvas centre requires T = s*(O - f).
    // The un-multiplied form only coincides at s = 1, which is why the locked
    // wide was correct while the whole pull-back was framed on empty space.
    world.style.transform =
      "translate(" + (s * (CENTER_X - fx)).toFixed(3) + "px," + (s * (CENTER_Y - fy)).toFixed(3) + "px) scale(" + s.toFixed(5) + ")";
  }
  applyCamera();

  // The ONE continuous outward pull. Custom ease: a long close-up dwell
  // (Scene 1), a faster middle travel (Scene 2), then heavy exponential-style
  // deceleration into the lock (Scene 3). Outward only, no push-in, no phase 2.
  const PULL_KEYS = [
    [0.0, 0.0],
    [0.3, 0.085],
    [0.5, 0.3],
    [0.625, 0.55],
    [0.78, 0.86],
    [0.9, 0.965],
    [1.0, 1.0],
  ];
  function pullEase(p) {
    for (let i = 0; i < PULL_KEYS.length - 1; i++) {
      const a = PULL_KEYS[i];
      const b = PULL_KEYS[i + 1];
      if (p <= b[0]) {
        const u = (p - a[0]) / (b[0] - a[0]);
        return a[1] + (b[1] - a[1]) * (u * u * (3 - 2 * u));
      }
    }
    return 1;
  }

  const tl = gsap.timeline({ paused: true });

  // --- Scene 1 (0.0-2.5s) -------------------------------------------------
  // The single camera move, already running under the macro. Nothing else in
  // the world is on screen: no chrome, no page.
  tl.fromTo(
    cam,
    { t: 0 },
    { t: 1, duration: 8.0, ease: pullEase, onUpdate: applyCamera },
    0
  );

  // Status-dot pulse - FINITE tween, never repeat/yoyo (this timeline is seeked).
  const pulse = { p: 0 };
  tl.to(
    pulse,
    {
      p: Math.PI * 2 * 3,
      duration: 4.4,
      ease: "none",
      onUpdate: function () {
        const sCore = 1 + Math.sin(pulse.p) * 0.12;
        const sRing = 1 + Math.sin(pulse.p + Math.PI / 2) * 0.07;
        dotCore.setAttribute("transform", "translate(15 15) scale(" + sCore.toFixed(4) + ") translate(-15 -15)");
        dotRing.setAttribute("transform", "translate(15 15) scale(" + sRing.toFixed(4) + ") translate(-15 -15)");
        dotRing.style.opacity = (0.5 + Math.sin(pulse.p) * 0.3).toFixed(3);
      },
    },
    0.2
  );

  // --- Scene 2 (2.5-5.0s) -------------------------------------------------
  // Intermediate nesting level: the assignment title and the instructor's
  // "5-7 business days" note resolve around the pill as partial letterforms
  // still filling frame. Text is static in world space - the camera's pull
  // produces the descent.
  tl.fromTo(
    title,
    { opacity: 0, y: 26, filter: "blur(10px)" },
    { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out" },
    2.7
  );
  tl.fromTo(
    eyebrow,
    { opacity: 0, y: 14, filter: "blur(8px)" },
    { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" },
    3.35
  );
  tl.fromTo(
    body,
    { opacity: 0, y: 18, filter: "blur(9px)" },
    { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.85, ease: "power3.out" },
    4.05
  );

  // The real capture resolves beneath the DOM world - one-way alpha + focus
  // settle, at 1:1-or-smaller only, never magnified.
  tl.fromTo(
    pagewrap,
    { opacity: 0, filter: "blur(7px)" },
    { opacity: 0.78, filter: "blur(0px)", duration: 3.8, ease: "power2.out" },
    2.6
  );

  // --- Scene 3 (5.0-8.0s) -------------------------------------------------
  // The pull completes with strong exponential deceleration and the frame
  // LOCKS at 8.0s. After this instant there is no camera tween at all.

  // --- Scene 4 (8.0-11.0s) ------------------------------------------------
  // Element-level payoff on the locked wide. The locked-badge row resolves
  // last as a one-way alpha settle; the screen already holds at reduced
  // contrast so the eye lands on the badge. Nothing else moves.
  tl.fromTo(
    lock,
    { opacity: 0, y: 18, filter: "blur(8px)" },
    { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0, ease: "power3.out" },
    8.1
  );
  tl.fromTo(
    pills,
    { scale: 0.86 },
    { scale: 1, duration: 0.7, ease: "expo.out", stagger: 0.09 },
    8.4
  );

  window.__timelines = window.__timelines || {};
  window.__timelines["01-the-wait"] = tl;
})();
</script>
