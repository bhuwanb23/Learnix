      var SAT_OPACITY = 0.18;
      var MUTED = [0x64, 0x74, 0x8b];
      var FAINT = [0x94, 0xa3, 0xb8];

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["08-learnix"] = tl;

      function clamp01(v) {
        return v < 0 ? 0 : v > 1 ? 1 : v;
      }
      // smoothstep — the per-item reveal curve, so a linear driver still reads as a settle
      function smooth(k) {
        return k * k * (3 - 2 * k);
      }
      function mixHex(a, b, k) {
        var r = Math.round(a[0] + (b[0] - a[0]) * k);
        var g = Math.round(a[1] + (b[1] - a[1]) * k);
        var bl = Math.round(a[2] + (b[2] - a[2]) * k);
        return "rgb(" + r + "," + g + "," + bl + ")";

      // ── Scene 1 (0.0–1.4s): the count figures drift slowly outward — the INVERTED clear.
      //    Finite single tweens (no loop): the numbers leave so the mark stays.
      var SATS = [
        { id: 0, dx: -190, dy: -120, rot: -4, revs: 0.75, phase: 0.0, at: 0.08 },
        { id: 1, dx: 200, dy: -70, rot: 5, revs: 0.52, phase: 1.05, at: 0.22 },
        { id: 2, dx: -180, dy: 70, rot: -6, revs: 0.88, phase: 2.2, at: 0.36 }
      ];
      var SAT_DRIFT = 2.0;

      SATS.forEach(function (s) {
        tl.fromTo(
          document.getElementById("f08-sat-" + s.id),
          { opacity: SAT_OPACITY, x: 0, y: 0, scale: 1, rotation: 0 },
          { opacity: 0, x: s.dx, y: s.dy, scale: 1.07, rotation: s.rot, duration: SAT_DRIFT, ease: "sine.inOut" },
          s.at
        );

        // svg-icon-enrichment — the satellite's ring + dot breathe, phase-offset per
        // figure, driven by a bounded phase proxy (never a yoyo / repeat loop)
        var dot = document.getElementById("f08-dot-" + s.id);
        var ring = document.getElementById("f08-ring-" + s.id);
        var state = { p: 0 };
        tl.to(
          state,
          {
            p: Math.PI * 2 * s.revs,
            duration: 3.0,
            ease: "none",
            onUpdate: function () {
              var deg = state.p * 57.29578;
              var dotScale = 1 + Math.sin(state.p + s.phase) * 0.1;
              var ringScale = 1 + Math.sin(state.p + s.phase + Math.PI / 2) * 0.07;
              dot.setAttribute(
                "transform",
                "rotate(" + deg.toFixed(2) + " 27 27) translate(27 27) scale(" + dotScale.toFixed(4) + ") translate(-27 -27)"
              );
              ring.setAttribute(
                "transform",
                "translate(27 27) scale(" + ringScale.toFixed(4) + ") translate(-27 -27)"
              );
              ring.style.opacity = (0.6 + Math.sin(state.p + s.phase) * 0.3).toFixed(3);

      //    Present and legible from t=0 (nothing builds in); the letters finish
      //    resolving on a long-tail power3 settle. Mark fixed, no bloom, no overshoot.
      var LETTERS = "Learnix".split("");
      var WORD_START = 1.4;
      var LETTER_BASE = 0.62;
      var LETTER_OVERLAP = 0.5;
      var LETTER_REST = 0.72;

      var cursor = 0;
      LETTERS.forEach(function (letter, i) {
        var window_ = LETTER_BASE + letter.length * 0.02;
        tl.fromTo(
          document.getElementById("f08-w-" + i),
          { opacity: LETTER_REST, y: 10 },
          { opacity: 1, y: 0, duration: window_, ease: "power3.out" },
          WORD_START + cursor

        cursor += Math.max(0, window_ - LETTER_OVERLAP);

      //    linear driver reverse-walks them and writes only on a changed step.
      var WORDS = ["12", "role", "apps", "·", "296", "endpoints", "·", "one", "system"];
      var LINE_START = 1.95;

      var SEC_PER_CHAR = 0.005;

        var dur = BASE_DURATION + w.length * SEC_PER_CHAR;
