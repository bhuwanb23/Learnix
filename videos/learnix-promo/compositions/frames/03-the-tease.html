      var PULSE_DOT_AMP = 0.14;
      var PULSE_RING_AMP = 0.07;
      var PULSE_RING_OPACITY_BASE = 0.45;
      var PULSE_RING_OPACITY_AMP = 0.35;

      var ring = document.getElementById("t03-ring");
      var core = document.getElementById("t03-core");
      var pulse = { p: 0 };

        pulse,

          duration: 3.2,
          ease: "none",

            ring.style.opacity = String(
