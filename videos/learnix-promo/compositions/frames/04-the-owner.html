  <script>
    (function () {
      var DURATION = 8;
      var RING_CENTER = { x: 960, y: 485 };

      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["04-the-owner"] = tl;

      // ── Scene 1 (0.0–1.4s): guide rings pulse and expand from centre, stroke by stroke ──
      var RINGS = [
        { r: 130, o: 0.9, at: 0.06 },
        { r: 196, o: 0.72, at: 0.145 },
        { r: 266, o: 0.56, at: 0.23 },
        { r: 340, o: 0.42, at: 0.315 },
        { r: 408, o: 0.3, at: 0.4 }
      ];

      RINGS.forEach(function (ring) {
        var el = document.getElementById("f04-ring-" + ring.r);
        tl.fromTo(
          el,
          { opacity: 0, scale: 0.58 },
          { opacity: ring.o, scale: 1, duration: 1.15, ease: "power3.out" },
          ring.at
        );
        // Scene 2 (1.4–3.2s): the rings settle outward while the glow ignites.
        tl.to(
          el,
          { scale: 1.045, opacity: ring.o * 0.78, duration: 1.7, ease: "power3.out" },
          1.62
        );
      });

      // ── Scene 2 (1.4–3.2s): the mark's glow ignites — a light switching on, not a bounce ──
      var glow = document.getElementById("f04-glow");
      var GLOW_PEAK = 0.28;
      var BLOOM_START = 1.45;
      var BLOOM_DUR = 1.45;

      tl.fromTo(
        glow,
        { opacity: 0, scale: 0.82 },
        { opacity: GLOW_PEAK, scale: 1, duration: BLOOM_DUR, ease: "power3.out" },
        BLOOM_START
      );

      // bounded idle breathe — a finite phase proxy, never a yoyo loop
      var phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * 1.5,
          duration: 5.0,
          ease: "none",
          onUpdate: function () {
            var s = Math.sin(phase.p);
            glow.style.opacity = String(GLOW_PEAK + s * 0.02);
            glow.style.transform = "scale(" + (1 + s * 0.012) + ")";
          }
        },
        BLOOM_START + BLOOM_DUR
      );

      // ── Scene 3 (3.2–5.6s): the line reveals per-word, content-paced, on a long-tail settle ──
      var WORDS = ["The", "wait", "has", "an", "owner."];
      var LINE_START = 3.2;
      var BASE_DURATION = 0.4;
      var SEC_PER_CHAR = 0.022;
      var REVEAL_DUR = 0.68;

      var cursor = 0;
      WORDS.forEach(function (word, i) {
        var el = document.getElementById("f04-word-" + i);
        var window_ = BASE_DURATION + word.length * SEC_PER_CHAR;
        tl.fromTo(
          el,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: REVEAL_DUR, ease: "power3.out" },
          LINE_START + cursor
        );
        cursor += window_;
      });

      // ── Scene 4 (5.6–8.0s): hold — mark and line still, no wordmark (saved for frame 08) ──
      tl.to({}, { duration: 0.001 }, DURATION);
    })();
  </script>
