  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var TOTAL_DURATION = 9;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.0-1.8s) — the surface simply is there ----------
      // Quiet opacity fade only. No slide, no accent shape, no camera: this beat
      // resolves rather than announces.
      tl.fromTo(
        "#t07-window",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        0,
      );
      tl.fromTo(
        "#t07-status",
        { opacity: 0 },
        { opacity: 1, duration: 0.5, ease: "power2.out" },
        0.08,
      );

      // ---------- Scene 2 (1.8-4.2s) — one discrete state swap ----------
      // discrete-text-sequence: whole states replaced at a threshold, no tween.
      // min-width on the wrap keeps the right edge from jittering between states.
      var STATUS_SEQUENCE = [
        { t: 0.0, main: "Submitted (Pending Grade)", note: "" },
        { t: 1.8, main: "Graded", note: "\u00a0\u00b7 feedback returned" },
      ];

      function statusAt(time) {
        for (var i = STATUS_SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= STATUS_SEQUENCE[i].t) return STATUS_SEQUENCE[i];
        }
        return STATUS_SEQUENCE[0];
      }

      var statusMainEl = document.getElementById("t07-status-main");
      var statusNoteEl = document.getElementById("t07-status-note");
      var statusDriver = { t: 0 };

      tl.to(
        statusDriver,
        {
          t: TOTAL_DURATION,
          duration: TOTAL_DURATION,
          ease: "none",
          onUpdate: function () {
            var state = statusAt(statusDriver.t);
            statusMainEl.textContent = state.main;
            statusNoteEl.textContent = state.note;
          },
        },
        0,
      );

      // the dot's hue travels with the text: amber (blocked) -> positive (resolved)
      tl.to("#t07-dot", { backgroundColor: "#059669", duration: 0.3, ease: "power2.out" }, 1.8);

      // ---------- Scene 3 (4.2-5.2s) — the callback, resolving last ----------
      // spring-pop-entrance, smooth long-tail settle. No overshoot anywhere.
      tl.fromTo(
        "#t07-badge",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
        4.2,
      );

      // svg-path-draw: the Unlocked chip's check is traced, not faded.
      var checkPath = document.getElementById("t07-check");
      var checkLen = checkPath.getTotalLength();
      checkPath.style.strokeDasharray = String(checkLen);
      checkPath.style.strokeDashoffset = String(checkLen);
      tl.to(
        "#t07-check",
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        4.55,
      );

      // ---------- Scene 4 (5.2-9.0s) — held quiet ----------
      // Nothing. The stillness is the payoff; the root transition is the exit.

      window.__timelines["07-resolve"] = tl;
      tl.seek(0);
    })();
  </script>
