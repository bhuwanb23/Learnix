        camera.style.transform =
          "translate(" + (cam.tx + dx).toFixed(3) + "px," + (cam.ty + dy).toFixed(3) + "px) scale(" + cam.scale.toFixed(4) + ")";

      // Scene 2 (3.2–6.8s) — the steady push THROUGH, travelling right along the chain.

      // Scene 3 (6.8–9.8s) — the traversal lands, then eases back out to a wider settle.
      tl.to(cam, { scale: 1.05, tx: -12, ty: -20, duration: 3.0, ease: "power3.out" }, 6.8);

      // The single writer — inserted last so it always reads the settled phase values.
      tl.to(
        drift,
        { p: Math.PI * 2 * DRIFT_CYCLES, duration: CAMERA_STOP, ease: "none", onUpdate: writeCamera },
        0
      );
      writeCamera();

      // ── backing field settles in behind the chain (Scene 1) ──
      tl.fromTo("#f06c-field", { opacity: 0 }, { opacity: 1, duration: 1.15, ease: "power2.out" }, 0.05);

      // ── Scene 1: the chrome eyebrow, then PENDING — the callback to frame 01 ──

        "#f06c-eyebrow",

      var COUNT_DUR = 2.15;
      var COUNT_EASE = "power3.out";
      var START_SCALE = 0.55; // START_SIZE / END_SIZE — design input, never tweened as a size

      METRICS.forEach(function (metric) {
        var el = document.getElementById(metric.id);
        var state = { value: 0 };

        tl.to(
          state,
          {
            value: metric.target,
            duration: COUNT_DUR,
            ease: COUNT_EASE,
            onUpdate: function () {
              el.textContent = Math.round(state.value).toLocaleString("en-US");
            }
          },
          COUNT_AT
        );

        tl.fromTo(el, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      });

      // Labels arrive early — before the count peaks.
      tl.fromTo(
        ".f06c-metric-label",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" },
        7.85
      );

      // ── Scene 4 (9.8–13.0s): hold. Nothing re-pushes, the counts do not re-tick.
      //    Low-amplitude jitter on the leading figure only, bounded to this window.
      var lead = document.getElementById("f06c-metric-1");
      var jitter = { p: 0 };

      tl.to(
        jitter,
        {
          p: Math.PI * 2 * 2.2,
          duration: 3.2,
          ease: "none",
          onUpdate: function () {
            lead.style.transform =
              "translate(" + (Math.sin(jitter.p) * 2.2).toFixed(2) + "px," +
              (Math.sin(jitter.p * 1.31) * 1.2).toFixed(2) + "px)";
          }
        },
        CAMERA_STOP
      );

      tl.to({}, { duration: 0.001 }, DURATION - 0.001);
    })();
  </script>
</template>
