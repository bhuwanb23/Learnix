name: CI

on:
  push:
    branches: [main, prev]
  pull_request:
    branches: [main, prev]

jobs:
  # ── Typecheck ──────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npx tsc --noEmit

  # ── Seed + Smoke test ──────────────────────────────────
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: learnix
          POSTGRES_PASSWORD: learnix_secret
          POSTGRES_DB: learnix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnix"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npx prisma db push --schema prisma/schema --skip-generate
        env:
          DATABASE_URL: postgresql://learnix:learnix_secret@localhost:5432/learnix_test
      - run: cd backend && npx tsx prisma/seed.ts
        env:
          DATABASE_URL: postgresql://learnix:learnix_secret@localhost:5432/learnix_test
      - run: cd backend && npx tsx prisma/seed-realistic.ts
        env:
          DATABASE_URL: postgresql://learnix:learnix_secret@localhost:5432/learnix_test
      - run: cd backend && npx tsx src/server.ts &
        env:
          DATABASE_URL: postgresql://learnix:learnix_secret@localhost:5432/learnix_test
          PORT: 4000
          JWT_ACCESS_SECRET: ci-test-access
          JWT_REFRESH_SECRET: ci-test-refresh
      - run: sleep 5 && cd backend && npx tsx scripts/smoke.ts

  # ── Web build ──────────────────────────────────────────
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learnix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: learnix/package-lock.json
      - run: npm ci
      - run: npx expo export --platform web

  # ── Docker build ────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: learnix-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
